# =========================================================
# SERVER PORT
# =========================================================
server.port=${PORT:8080}

# =========================================================
# DATABASE CONFIGURATION
# =========================================================
# If SPRING_DATASOURCE_URL is set (e.g. cloud MySQL/PostgreSQL), it connects to it.
# Otherwise, falls back to embedded H2 (MySQL mode) so the server boots cleanly anywhere.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/smartcropdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# =========================================================
# JPA & HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# =========================================================
# BREVO SMTP EMAIL CONFIGURATION
# =========================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:9fb303001@smtp-brevo.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.from=${SPRING_MAIL_FROM:varshithvarshithd@gmail.com}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================================
# CORS SETTINGS
# =========================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.onrender.com}

