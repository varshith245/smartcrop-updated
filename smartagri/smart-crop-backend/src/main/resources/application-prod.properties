# ==============================================================================
# SMARTCROP AI — PRODUCTION PROFILE FOR RENDER DEPLOYMENT
# ==============================================================================

# If SPRING_DATASOURCE_URL is provided (Aiven, Railway, Render Postgres, etc.), it connects to it.
# Otherwise, it falls back to in-memory H2 with MySQL compatibility mode so the server boots cleanly.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartcropdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
