services:
  # ============================================================================
  # 1. SMARTCROP SPRING BOOT BACKEND WEB SERVICE
  # ============================================================================
  - type: web
    name: smartcrop-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/crops
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_MAIL_HOST
        value: smtp-relay.brevo.com
      - key: SPRING_MAIL_PORT
        value: 587
      - key: SPRING_MAIL_USERNAME
        value: 9fb303001@smtp-brevo.com
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_FROM
        value: varshithvarshithd@gmail.com
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.onrender.com"

  # ============================================================================
  # 2. SMARTCROP REACT FRONTEND STATIC SITE
  # ============================================================================
  - type: web
    name: smartcrop-frontend
    env: static
    rootDir: smartagri/smart-crop-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smartcrop-backend
          property: host
          path: /api
